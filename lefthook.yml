pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,json,css}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    types:
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc -b --noEmit
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact

commit-msg:
  commands:
    no-attribution:
      run: |
        if grep -qiE 'co-authored-by|generated with' {1}; then
          echo "Blocked: remove Co-Authored-By / 'Generated with' lines (Sam only)." >&2
          exit 1
        fi
